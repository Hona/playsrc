[package]
name = "playsrc-vpk"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1.5.0"
md-5 = "0.10.6"
rsa = { version = "0.9.8", default-features = false, features = ["sha2", "std"] }
sha2 = { version = "0.10.9", features = ["oid"] }

[lib]
path = "src/lib.rs"
