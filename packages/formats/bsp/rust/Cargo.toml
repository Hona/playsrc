[package]
name = "playsrc-bsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1.5.0"
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "optimization"] }
rayon = "1.11.0"
zip = { version = "8.6.0", default-features = false, features = ["lzma"] }

[dev-dependencies]
lzma-rs = "0.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"

[lib]
path = "src/lib.rs"
