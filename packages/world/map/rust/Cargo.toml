[package]
name = "playsrc-map"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
playsrc-bsp = { path = "../../../formats/bsp/rust" }
playsrc-collision = { path = "../../collision/rust" }
playsrc-entity = { path = "../../entity/rust" }
playsrc-material = { path = "../../material/rust" }
playsrc-visibility = { path = "../../visibility/rust" }
sha2 = "0.10.9"

[dev-dependencies]
playsrc-asset-graph = { path = "../../../asset-store/rust" }
playsrc-keyvalues = { path = "../../../formats/keyvalues/rust" }
playsrc-vmt = { path = "../../../formats/vmt/rust" }
playsrc-vtf = { path = "../../../formats/vtf/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
