[package]
name = "playsrc-collision"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
replay-reference = []

[dependencies]
playsrc-bsp = { path = "../../../formats/bsp/rust" }
playsrc-phy = { path = "../../../formats/phy/rust" }
sha2 = "0.11"

[dev-dependencies]
playsrc-physics = { path = "../../../runtime/physics/rust" }
playsrc-asset-graph = { path = "../../../asset-store/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[example]]
name = "brush_queries"
required-features = ["replay-reference"]

[lib]
path = "src/lib.rs"
