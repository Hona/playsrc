name: Prepare release package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build immutable release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Require main workflow identity
        run: test "$GITHUB_SHA" = "$(git rev-parse HEAD)" && test "$GITHUB_REF" = refs/heads/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2025-12-10
          components: rust-src
      - run: bun install --frozen-lockfile
      - run: cargo +1.97.1 install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build once for headed acceptance and deployment
        run: bun tools/playsrc/src/prepare-release-package.ts
      - uses: actions/upload-artifact@v7
        with:
          name: tf2-release-package
          path: apps/web/tf2/dist/cloudflare
          if-no-files-found: error
          retention-days: 14
