name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test deployable main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Set up threaded Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2025-12-10
          components: rust-src

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install wasm-bindgen
        run: cargo +1.97.1 install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Generate TF2 WASM bindings
        run: bun run build:tf2-wasm-bindings

      - name: Verify changed release WASM pin
        id: release-wasm
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- apps/web/tf2/releases/current.json; then
            exit 0
          fi
          bun -e '
            const release = await Bun.file("apps/web/tf2/releases/current.json").json();
            const bytes = await Bun.file("games/tf2/browser/src/wasm-generated/tf2_wasm_bg.wasm").arrayBuffer();
            const actual = { byteLength: String(bytes.byteLength), sha256: new Bun.CryptoHasher("sha256").update(bytes).digest("hex") };
            console.log(JSON.stringify({ expected: release.objects.wasm, actual }));
            if (actual.byteLength !== release.objects.wasm.byteLength || actual.sha256 !== release.objects.wasm.sha256) throw new Error("Compiled WASM differs from changed release pin");
          '

      - name: Retain mismatched compiled WASM
        if: failure() && steps.release-wasm.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compiled-release-wasm
          path: games/tf2/browser/src/wasm-generated/tf2_wasm_bg.wasm
          retention-days: 3

      - name: Test
        run: bun test

      - name: Test Rust
        run: bun run test:rust

      - name: Verify deployment package
        run: bun run infra:verify
