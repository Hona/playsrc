name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test deployable main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Set up threaded Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly-2025-12-10
          components: rust-src

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install wasm-bindgen
        run: cargo +1.97.1 install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Generate TF2 WASM bindings
        run: bun run build:tf2-wasm-bindings

      - name: Test
        run: bun test

      - name: Test Rust
        run: bun run test:rust

      - name: Verify deployment package
        run: bun run infra:verify jump_beef
