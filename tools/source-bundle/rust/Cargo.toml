[package]
name = "playsrc-source-bundle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "playsrc-source-bundle"

[features]
verify-hdr = ["dep:playsrc-tf2-wasm"]
presentation-bound-diagnostic = ["dep:playsrc-tf2-wasm", "playsrc-tf2-wasm/presentation-bound-diagnostic"]

[dependencies]
playsrc-audio = { path = "../../../packages/presentation/audio/rust" }
playsrc-asset-graph = { path = "../../../packages/asset-store/rust" }
playsrc-bsp = { path = "../../../packages/formats/bsp/rust" }
playsrc-content = { path = "../../../packages/content/rust" }
playsrc-keyvalues = { path = "../../../packages/formats/keyvalues/rust" }
playsrc-map = { path = "../../../packages/world/map/rust" }
playsrc-nav = { path = "../../../packages/formats/nav/rust" }
playsrc-material = { path = "../../../packages/world/material/rust" }
playsrc-particle = { path = "../../../packages/presentation/particle/rust" }
playsrc-entity = { path = "../../../packages/world/entity/rust" }
playsrc-studio-model = { path = "../../../packages/formats/studio-model/rust" }
playsrc-tf2 = { path = "../../../games/tf2/rust" }
playsrc-tf2-wasm = { path = "../../../games/tf2/wasm", optional = true }
playsrc-vmt = { path = "../../../packages/formats/vmt/rust" }
playsrc-vpk = { path = "../../../packages/formats/vpk/rust", default-features = false }
playsrc-vtf = { path = "../../../packages/formats/vtf/rust" }
playsrc-vhv = { path = "../../../packages/formats/vhv/rust" }
png = "0.17.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[[bin]]
name = "playsrc-source-bundle"
path = "src/main.rs"

[[bin]]
name = "playsrc-verify-map-runtime"
path = "src/verify-map-runtime.rs"
required-features = ["verify-hdr"]
