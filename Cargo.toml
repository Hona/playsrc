[workspace]
members = [
  "packages/asset-store/rust",
  "packages/formats/bsp/rust",
  "packages/formats/keyvalues/rust",
  "packages/formats/choreography/rust",
  "packages/formats/nav/rust",
  "packages/formats/vpk/rust",
  "packages/formats/vmt/rust",
  "packages/formats/vtf/rust",
  "packages/formats/studio-model/rust",
  "packages/formats/vhv/rust",
  "packages/formats/phy/rust",
  "packages/formats/wav/rust",
  "packages/formats/mp3/rust",
  "packages/content/rust",
  "packages/world/entity/rust",
  "packages/world/collision/rust",
  "packages/world/visibility/rust",
  "packages/world/material/rust",
  "packages/world/map/rust",
  "packages/world/map/wasm",
  "packages/presentation/particle/rust",
  "packages/presentation/beam/rust",
  "packages/presentation/audio/rust",
  "packages/presentation/audio/wasm",
  "packages/runtime/movement/rust",
  "games/tf2/rust",
  "games/tf2/wasm",
  "tools/source-bundle/rust",
]
resolver = "2"
exclude = ["packages/runtime/simulation/rust"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.source-bundle]
inherits = "release"
codegen-units = 256
incremental = true
opt-level = 1
strip = "debuginfo"
