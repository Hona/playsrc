<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Play Source games in your browser." />
    <link rel="canonical" href="https://playsrc.online/" />
    <title>playsrc</title>
    <style>
      :root { color: #f4efe6; background: #15191c; font: 18px/1.5 system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(34rem, calc(100% - 3rem)); }
      h1 { margin: 0 0 .25rem; font-size: clamp(3rem, 12vw, 7rem); letter-spacing: -.08em; }
      p { color: #aeb8bc; }
      a { display: inline-block; margin-top: 1.5rem; padding: .8rem 1.1rem; color: #15191c; background: #f4a340; border-radius: .35rem; font-weight: 750; text-decoration: none; }
      a:focus-visible { outline: .2rem solid #fff; outline-offset: .2rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>playsrc</h1>
      <p>Source, directly in the browser.</p>
      <a href="/tf2">Play Team Fortress 2</a>
    </main>
  </body>
</html>
